
services:
  storage-init:
    image: ghcr.io/apache/hadoop:3.5.0
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command: ["chown hadoop:users /nn /dn"]
    volumes:
      - namenode-data:/nn
      - datanode-data:/dn

  namenode:
    image: ghcr.io/apache/hadoop:3.5.0
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file:
      - ./config
    environment:
      ENSURE_NAMENODE_DIR: /storage/name
    ports:
      - "127.0.0.1:9870:9870"
    volumes:
      - namenode-data:/storage
      - ./workspace:/workspace
    depends_on:
      storage-init:
        condition: service_completed_successfully

  datanode:
    image: ghcr.io/apache/hadoop:3.5.0
    hostname: datanode
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    environment:
      WAITFOR: namenode:8020
    volumes:
      - datanode-data:/storage
    depends_on:
      storage-init:
        condition: service_completed_successfully
      namenode:
        condition: service_started

  resourcemanager:
    image: ghcr.io/apache/hadoop:3.5.0
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    env_file:
      - ./config
    ports:
      - "127.0.0.1:8088:8088"

  nodemanager:
    image: ghcr.io/apache/hadoop:3.5.0
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
    environment:
      WAITFOR: resourcemanager:8031
    depends_on:
      - resourcemanager

volumes:
  namenode-data:
  datanode-data:
